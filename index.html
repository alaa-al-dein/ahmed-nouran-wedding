.page3{
  min-height:100vh;
  scroll-snap-align:start;
  display:flex;
  flex-direction:column;
  justify-content:center;
  padding:40px 0;
  scroll-margin-top:0;
}
html.scroll body{scroll-snap-type:y proximity;overscroll-behavior-y:none}
@media (max-width:600px){
  .page3{min-height:100svh;padding:24px 0}
}
.gcard{border:1px solid rgba(118,86,47,.35);padding:24px 18px 22px;background:rgba(250,247,239,.84);color:#76562f;max-width:92%;margin:0 auto}
.gcard h2{margin:0;text-align:center;font-family:'Cormorant Garamond',Georgia,serif;font-weight:500;font-size:18px;letter-spacing:.12em;text-transform:uppercase}
.gcard .rule{margin:12px 6px 18px}.gcard .rule i{background:rgba(118,86,47,.35)}
form{display:flex;flex-direction:column;gap:16px}
label{display:flex;flex-direction:column;gap:6px;font-size:10px;color:#76562f;letter-spacing:.14em;text-transform:uppercase}
input,textarea{font:inherit;font-size:14px;letter-spacing:.02em;text-transform:none;color:#76562f;background:rgba(255,255,255,.55);border:1px solid rgba(118,86,47,.35);border-radius:2px;padding:11px 12px;width:100%}
input::placeholder,textarea::placeholder{color:rgba(118,86,47,.55)}
textarea{min-height:96px;resize:vertical}
input:focus,textarea:focus{outline:2px solid rgba(255,255,255,.85);outline-offset:1px}
.send{margin-top:4px;padding:11px;border:1px solid rgba(118,86,47,.5);background:rgba(255,255,255,.5);color:#76562f;font:inherit;font-size:12px;letter-spacing:.24em;text-transform:uppercase;cursor:pointer}
.send:hover{background:rgba(255,255,255,.26)}
.send:focus-visible,.tog:focus-visible,.map:focus-visible,.seal1:focus-visible{outline:2px solid #fff;outline-offset:3px}
form.hide{display:none}
.thanks{display:none;text-align:center;color:#76562f;font-size:14px;letter-spacing:.08em;line-height:1.9;padding:14px 0 4px}
.thanks.show{display:block}
.wall{margin-top:20px;display:flex;flex-direction:column;gap:12px}
.wall:not(:empty){border-top:1px solid rgba(255,255,255,.35);padding-top:16px}
.msg{background:rgba(255,255,255,.55);color:#76562f;padding:12px 14px;font-size:14px;line-height:1.6;overflow-wrap:anywhere}
.msg b{display:block;font-weight:400;font-size:12px;letter-spacing:.14em;text-transform:uppercase;margin-bottom:3px}
.msg .song{display:block;font-size:12.5px;opacity:.85;margin-bottom:5px}
.tog{position:fixed;right:14px;bottom:calc(14px + env(safe-area-inset-bottom,0px));width:42px;height:42px;border-radius:50%;border:1px solid rgba(255,255,255,.75);background:rgba(90,86,76,.55);color:#fff;font-size:17px;cursor:pointer;z-index:9;backdrop-filter:blur(4px)}
.tog.off{opacity:.6}
.tog.off::after{content:"";position:absolute;left:9px;right:9px;top:50%;height:1px;background:#fff;transform:rotate(-40deg)}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01s!important;transition-duration:.01s!important;transition-delay:0s!important}}

/* Refined typography/layout for page 2 */
.poster{overflow:hidden;color:#6f5837;}
.poster .ln{position:absolute;left:50%;transform:translateX(-50%);width:78%;text-align:center;color:#6f5837;z-index:2;}
.poster .mono{position:absolute;left:50%;top:12.5%;transform:translateX(-50%);font-family:'Marcellus',Georgia,serif;font-size:1.84cqw;letter-spacing:.18em;line-height:1.05;color:#8b7044;text-align:center;z-index:2;}
.poster .sm{font-family:'Marcellus','Cormorant Garamond',Georgia,serif;font-size:1.61cqw;line-height:1.5;letter-spacing:.22em;text-transform:uppercase;font-weight:400;color:#665438;text-shadow:0 1px 1px rgba(255,255,255,.65);}
.poster .nm{font-family:'Pinyon Script','Cormorant Garamond',cursive;font-size:6.35cqw;line-height:1;font-weight:400;letter-spacing:.01em;color:#80683f;text-transform:none;text-shadow:0 1px 1px rgba(255,255,255,.7);white-space:nowrap;}
.poster .and{font-family:'Pinyon Script','Cormorant Garamond',cursive;font-size:3.77cqw;line-height:1;color:#80683f;font-weight:400;}
.poster .rule{display:flex;align-items:center;justify-content:center;gap:2.2%;height:auto;color:#8a7045;}
.poster .rule i{display:block;height:1px;background:rgba(128,104,63,.55);flex:1;max-width:42%;}
.poster .rule b{font-family:Georgia,serif;font-size:1.66cqw;font-weight:400;color:#9a7a43;line-height:1;}
.poster .date{display:flex;align-items:center;justify-content:center;gap:3.5%;font-family:'Marcellus',Georgia,serif;color:#665438;}
.poster .date span{font-size:1.61cqw;letter-spacing:.16em;text-transform:uppercase;}
.poster .date strong{font-family:'Cormorant Garamond',Georgia,serif;font-size:4.6cqw;line-height:.9;font-weight:500;color:#80683f;}
.poster .date em{display:block;width:1px;height:4.6cqw;background:rgba(128,104,63,.42);}

/* Elegant wedding countdown on the final page */
.countdown-wrap{width:min(92%,560px);margin:0 auto 26px;text-align:center;color:#76562f;}
.countdown-title{font-family:'Cormorant Garamond',Georgia,serif;font-size:13px;letter-spacing:.28em;text-transform:uppercase;margin:0 0 5px;color:#80683f;}
.countdown-date{font-family:'Marcellus',Georgia,serif;font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:#8b7044;margin-bottom:14px;}
.countdown{display:flex;justify-content:center;align-items:stretch;gap:8px;}
.countdown .unit{min-width:74px;padding:10px 7px 8px;border:1px solid rgba(118,86,47,.30);background:rgba(250,247,239,.58);border-radius:2px;backdrop-filter:blur(2px);}
.countdown .num{display:block;font-family:'Cormorant Garamond',Georgia,serif;font-size:27px;line-height:1;color:#76562f;font-weight:500;}
.countdown .label{display:block;margin-top:5px;font-family:'Marcellus',Georgia,serif;font-size:7px;letter-spacing:.16em;text-transform:uppercase;color:#8b7044;}
.countdown-rule{width:54px;height:1px;margin:0 auto 12px;background:rgba(118,86,47,.35);position:relative;}
.countdown-rule::after{content:'♥';position:absolute;left:50%;top:50%;transform:translate(-50%,-52%);padding:0 7px;background:rgba(122,117,106,.92);font-size:10px;color:#9a7a43;}
@media (max-width:480px){

  .countdown{gap:5px;}

@media (max-width:600px){
  html,body{width:100%;min-width:0}
  body{overflow:hidden;-webkit-text-size-adjust:100%}
  .s1{width:100vw;height:100svh;min-height:100svh}
  .env1{max-height:100svh;max-width:100vw;height:min(100svh,146.92vw);width:auto}

    width:100%;
    min-height:100svh;
    padding:18px 10px calc(22px + env(safe-area-inset-bottom,0px));

  }

  }
  .gcard h2{font-size:17px}
  form{gap:12px}
  label{font-size:9px;letter-spacing:.11em}
  input,textarea{font-size:14px;padding:10px 11px}
  textarea{min-height:82px}
  .send{padding:10px;font-size:11px}
  .wall{margin-top:14px;gap:9px}

}
@media (max-width:380px){
  .page3{padding-left:8px;padding-right:8px}
  .countdown-title{font-size:11px}
  .countdown-date{font-size:8px}
  .countdown .num{font-size:20px}
  .countdown .label{font-size:5px}
  .gcard{padding-left:11px;padding-right:11px}
}


/* Final mobile sizing fix */
@media (max-width: 600px){
  html, body{width:100%; max-width:100%; overflow-x:hidden;}
  .s1{width:100vw;height:100svh;min-height:100svh;}
  .env1{
    width:min(100vw, calc(100svh * 942 / 1384));
    height:min(100svh, calc(100vw * 1384 / 942));
    max-width:100vw;
    max-height:100svh;
    aspect-ratio:942 / 1384;
  }
  .s2{width:100vw;max-width:100vw;margin:0;overflow:visible;}
  .poster{
    width:100vw;
    height:150vw;
    min-height:0;
    aspect-ratio:2 / 3;
    background-size:100% 100%;
    background-position:center top;
    background-repeat:no-repeat;
  }
  .page3{
    width:100vw;
    min-height:100svh;
    height:auto;
    padding:22px 12px calc(24px + env(safe-area-inset-bottom,0px));
    justify-content:flex-start;
    overflow:visible;
  }
  .countdown-wrap{width:100%;max-width:390px;margin:0 auto 16px;}
  .countdown{width:100%;gap:4px;}
  .countdown .unit{flex:1 1 0;min-width:0;padding:8px 2px 7px;}
  .gcard{width:100%;max-width:390px;margin:0 auto;padding:17px 12px 16px;}

  input,textarea{max-width:100%;}

  .gcard{padding-left:10px;padding-right:10px;}
  .countdown .num{font-size:20px;}
}
</style>

<style>
.instagram-link{display:flex;align-items:center;justify-content:center;gap:8px;width:max-content;margin:24px auto 4px;color:inherit;text-decoration:none;font-size:13px;letter-spacing:.2px;opacity:.9;transition:opacity .2s,transform .2s;}
.instagram-link:hover{opacity:1;transform:translateY(-1px);}
.instagram-link svg{width:24px;height:24px;display:block;}
@media (max-width:480px){.instagram-link{margin-top:20px;font-size:12px;gap:7px}.instagram-link svg{width:22px;height:22px}}
</style>
</head>
<body>
<div class="s1" id="s1">
  <div class="env1" id="env1" role="button" tabindex="0" aria-label="Open the invitation">
    <button class="seal1" id="seal" aria-label="Open the invitation"></button>
  </div>
  <div class="flash"></div>
</div>

<main class="s2" id="s2" hidden>
  <div class="poster" aria-label="Wedding invitation card">
    <a class="location-hotspot" href="https://maps.app.goo.gl/wZtrRqveoJy5F7tr9" target="_blank" rel="noopener noreferrer" aria-label="Open El Gouna Hall location in Google Maps"></a>
  </div>

  <section class="page3" id="page3" aria-label="Messages page">
  <section class="ayah" dir="rtl" lang="ar">
    <div class="rule" dir="ltr"><i></i><b>♥</b><i></i></div>
  </section>


    <div class="countdown-wrap" aria-label="Countdown to the wedding">
      <div class="countdown-title">Until We Say I Do</div>
      <div class="countdown-date">9 October 2026 &nbsp;—&nbsp; 8:00 PM</div>
      <div class="countdown-rule"></div>
      <div class="countdown" id="weddingCountdown">
        <div class="unit"><span class="num" id="cdDays">--</span><span class="label">Days</span></div>
        <div class="unit"><span class="num" id="cdHours">--</span><span class="label">Hours</span></div>
        <div class="unit"><span class="num" id="cdMinutes">--</span><span class="label">Minutes</span></div>
        <div class="unit"><span class="num" id="cdSeconds">--</span><span class="label">Seconds</span></div>
      </div>
    </div>
  <section class="form">
    <div class="gcard">
      <h2>Leave a Message</h2>
      <div class="rule"><i></i><b>♥</b><i></i></div>
      <form id="rsvpForm">
        <label>Your name<input type="text" id="rsvpName" required placeholder="Enter your name"></label>
        <label>Your favorite song<input type="text" id="rsvpSong" placeholder="Song title – Artist"></label>
        <label>Your message for the couple<textarea id="rsvpMsg" required placeholder="Write your congratulations or best wishes..."></textarea></label>
        <button type="submit" class="send">Send Message</button>
      </form>
      <div class="thanks" id="thanks">Thank you 🤍<br>Your message has been received</div>
      <div class="wall" id="approvedWall" aria-live="polite"></div>

      <a class="instagram-link" href="https://www.instagram.com/3laa.al_dein/" target="_blank" rel="noopener noreferrer" aria-label="Instagram - 3laa.al_dein">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <rect x="3" y="3" width="18" height="18" rx="5" fill="none" stroke="currentColor" stroke-width="1.8"/>
          <circle cx="12" cy="12" r="4.2" fill="none" stroke="currentColor" stroke-width="1.8"/>
          <circle cx="17.4" cy="6.7" r="1.1" fill="currentColor"/>
        </svg>
        <span>@3laa.al_dein</span>
      </a>
    </div>
  </section>
  </section>
</main>
<button class="tog" id="tog" aria-label="Toggle music" aria-pressed="true" hidden>♪</button>

<script>
(function(){
  var s1=document.getElementById('s1'),s2=document.getElementById('s2'),env1=document.getElementById('env1'),seal=document.getElementById('seal'),tog=document.getElementById('tog');
  var audio=new Audio("music.mp3");audio.loop=true;audio.volume=.25;
  function ui(p){tog.classList.toggle('off',!p);tog.setAttribute('aria-pressed',p?'true':'false');}
  function openInvitation(){
    if(s1.classList.contains('opening'))return;
    s1.classList.add('opening');
    var p=audio.play();if(p&&p.then){p.then(function(){ui(true);}).catch(function(){ui(false);});}
    // Bring the second page in while the first card is still visible, so there is no blank/disappearing moment.
    setTimeout(function(){
      s2.hidden=false;tog.hidden=false;document.documentElement.classList.add('scroll');
      requestAnimationFrame(function(){requestAnimationFrame(function(){s2.classList.add('show');});});
    },650);
    setTimeout(function(){s1.hidden=true;window.scrollTo(0,0);},1450);
  }
  env1.addEventListener('click',openInvitation);
  env1.addEventListener('keydown',function(e){if(e.key==='Enter'||e.key===' '){e.preventDefault();openInvitation();}});
  // Swipe up on the invitation page to reveal the complete messages page.
  (function(){
    var page3=document.getElementById('page3');
    if(!page3)return;
    var startY=0,startX=0;
    document.addEventListener('touchstart',function(e){
      if(!s2.classList.contains('show'))return;
      var t=e.touches[0]; startY=t.clientY; startX=t.clientX;
    },{passive:true});
    document.addEventListener('touchend',function(e){
      if(!s2.classList.contains('show'))return;
      var t=e.changedTouches[0], dy=t.clientY-startY, dx=t.clientX-startX;
      if(Math.abs(dy)>60 && Math.abs(dy)>Math.abs(dx) && dy<0){
        page3.scrollIntoView({behavior:'smooth',block:'start'});
      }
    },{passive:true});
  })();

  tog.addEventListener('click',function(){
    if(audio.paused){audio.play().then(function(){ui(true);}).catch(function(){});}else{audio.pause();ui(false);}
  });


  // Wedding countdown — 9 October 2026 at 8:00 PM (Egypt time)
  (function(){
    var target=Date.parse('2026-10-09T20:00:00+03:00');
    var d=document.getElementById('cdDays'),h=document.getElementById('cdHours'),m=document.getElementById('cdMinutes'),sec=document.getElementById('cdSeconds');
    function tick(){
      var diff=Math.max(0,target-Date.now());
      var days=Math.floor(diff/86400000); diff%=86400000;
      var hours=Math.floor(diff/3600000); diff%=3600000;
      var mins=Math.floor(diff/60000); diff%=60000;
      var secs=Math.floor(diff/1000);
      if(d){d.textContent=String(days).padStart(2,'0');h.textContent=String(hours).padStart(2,'0');m.textContent=String(mins).padStart(2,'0');sec.textContent=String(secs).padStart(2,'0');}
      if(target-Date.now()<=0){d.textContent='00';h.textContent='00';m.textContent='00';sec.textContent='00';}
    }
    tick(); setInterval(tick,1000);
  })();

  // Guestbook: messages are sent to a private Google Apps Script endpoint.
  // The endpoint stores every message, forwards it to Telegram, and returns ONLY approved messages to the public page.
  var GUESTBOOK_API_URL='https://script.google.com/macros/s/AKfycbynONXVJsj6NsWvKrQlYxrKZCvvVJVzIgXx_5C_oXjKQJYw3-cDxWHE-g6wF-bhoUPG/exec';
  var form=document.getElementById('rsvpForm'),thanks=document.getElementById('thanks');
  var wall=document.getElementById('approvedWall');
  async function sendGuestMessage(name,song,msg){
    if(!GUESTBOOK_API_URL || GUESTBOOK_API_URL==='PASTE_YOUR_APPS_SCRIPT_WEB_APP_URL_HERE') throw new Error('Guestbook endpoint is not configured');
    var res=await fetch(GUESTBOOK_API_URL,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({name:name,song:song,message:msg})});
    var data=await res.json();
    if(!data.ok) throw new Error(data.error||'Message was not accepted');
    return data;
  }
  function renderApproved(items){
    if(!wall)return;
    wall.innerHTML='';
    items.forEach(function(x){
      var card=document.createElement('div'); card.className='msg';
      var b=document.createElement('b'); b.textContent=x.name||'Guest'; card.appendChild(b);
      if(x.song){var song=document.createElement('span'); song.className='song'; song.textContent='🎵 '+x.song; card.appendChild(song);}
      var body=document.createElement('div'); body.textContent=x.message||''; card.appendChild(body);
      wall.appendChild(card);
    });
  }
  async function loadApproved(){
    if(!GUESTBOOK_API_URL || GUESTBOOK_API_URL==='PASTE_YOUR_APPS_SCRIPT_WEB_APP_URL_HERE')return;
    try{var res=await fetch(GUESTBOOK_API_URL+'?action=approved',{cache:'no-store'}); var data=await res.json(); if(data.ok)renderApproved(data.messages||[]);}catch(err){console.warn('Approved messages could not be loaded',err);}
  }
  form.addEventListener('submit',async function(e){
    e.preventDefault();
    var n=document.getElementById('rsvpName').value.trim(), so=document.getElementById('rsvpSong').value.trim(), m=document.getElementById('rsvpMsg').value.trim();
    if(!n||!m)return;
    var submitBtn=form.querySelector('button[type="submit"],input[type="submit"]');
    if(submitBtn){submitBtn.disabled=true;submitBtn.dataset.originalText=submitBtn.textContent;submitBtn.textContent='جاري الإرسال...';}
    try{
      await sendGuestMessage(n,so,m);
      form.reset(); form.classList.add('hide'); thanks.classList.add('show');
      loadApproved();
    }catch(err){
      console.error(err); alert('تعذر إرسال الرسالة الآن. حاول مرة أخرى.');
      if(submitBtn){submitBtn.disabled=false;submitBtn.textContent=submitBtn.dataset.originalText||'إرسال';}
    }
  });
  loadApproved();
})();
</script>
</body>
</html>
